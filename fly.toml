# Fly.io settings for SYSTEM AI (the Princess Posse Discord bot).
app = "system-ai-posse"
primary_region = "iad"

[build]

[env]
  BOT_NAME = "SYSTEM AI"
  DATA_DIR = "/data"
  PORT = "3000"
  TIMEZONE = "America/New_York"

[mounts]
  source = "bot_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
